name: Easify
description: A new Flutter project.

publish_to: "none" # Remove this line if you plan to publish the package.

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  network_info_plus: ^5.0.2 # or latest version
  esc_pos_printer: ^4.0.4
  esc_pos_utils: ^1.1.0
  charset_converter: ^2.1.0

  # ObjectBox
  objectbox: ^4.2.0
  objectbox_flutter_libs: ^4.2.0
  shared_preferences: ^2.5.3
  validators: ^3.0.0
  mrx_charts: ^0.1.3
  image: ^3.3.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # ObjectBox code generation
  build_runner: ^2.4.8
  objectbox_generator: ^4.2.0

  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: false
  image_path: "lib\\assets\\easify (1).png"

flutter:
  uses-material-design: true
  assets:
    - lib\\assets\\frita.png
