name: Easify
description: Easify POS — caisse enregistreuse pour cafés et petits commerces (Marrakech).

publish_to: "none" # Remove this line if you plan to publish the package.

# P54: the product is "2.0.0.2" — the identity card said 1.0.0+1.
# Pub only accepts X.Y.Z+build, so the 4th digit lives in the build
# number: version 2.0.0, build 20002 (= 2.0.0.2).
version: 2.0.0+20002

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_localizations:
    sdk: flutter
  esc_pos_printer: ^4.0.4
  esc_pos_utils: ^1.1.0

  # ObjectBox
  objectbox: ^4.2.0
  objectbox_flutter_libs: ^4.2.0
  shared_preferences: ^2.5.3
  validators: ^3.0.0
  image: ^3.3.0
  image_picker: ^1.0.7
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.1
  crypton: ^2.0.1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^4.0.0
  reorderable_grid_view: ^2.2.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  go_router: ^14.6.2
  intl: ^0.20.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # ObjectBox code generation
  build_runner: ^2.4.8
  objectbox_generator: ^4.2.0

  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: false
  image_path: "lib/assets/easify (1).png"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/easify (1).png

dependency_overrides:
  pointycastle: ^4.0.0
